# TypeScript
id: typescript-no-object-parameters
language: TypeScript
severity: warning
message: Broad object parameter hides field contract. Use named domain type. Raw object may enter parser; do not pass it into domain code.
rule:
  all:
    - any:
        - kind: required_parameter
        - kind: optional_parameter
        - kind: rest_pattern
    - has:
        kind: predefined_type
        regex: '^object$'
        stopBy: end
---
# JavaScript
id: javascript-no-object-parameters
language: JavaScript
severity: warning
message: Broad object JSDoc parameter hides field contract. Document named domain type. Raw object may enter parser; do not pass it into domain code.
rule:
  kind: comment
  regex: '(?s).*@param\s*\{\s*object\s*\}.*'
---
# Python
id: python-no-object-parameters
language: Python
severity: warning
message: Broad object parameter hides field contract. Use named protocol or class. Raw object may enter parser; do not pass it into domain code.
rule:
  kind: typed_parameter
  has:
    kind: identifier
    regex: '^object$'
    stopBy: end
