id: typescript-require-safety-comment-for-type-assertion
language: TypeScript
severity: warning
message: This type assertion has no SAFETY justification immediately before or inside its statement.
utils:
  non-const-assertion:
    any:
      - kind: as_expression
        not:
          regex: '(?s).*\bas\s+const\s*$'
      - kind: type_assertion
        not:
          regex: '(?s)^\s*<\s*const\s*>'
rule:
  all:
    - any:
        - kind: lexical_declaration
        - kind: variable_declaration
        - kind: return_statement
        - kind: expression_statement
        - kind: throw_statement
    - has:
        matches: non-const-assertion
        stopBy: end
    - not:
        any:
          - has:
              kind: comment
              regex: '(?s).*\bSAFETY\s*:.*'
              stopBy: end
          - follows:
              kind: comment
              regex: '(?s).*\bSAFETY\s*:.*'
              stopBy: neighbor
