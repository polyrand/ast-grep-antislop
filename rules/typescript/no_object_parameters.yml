id: typescript-no-object-parameters
language: TypeScript
severity: warning
message: Broad object parameters hide the input contract; accept a named owner type.
rule:
  all:
    - any:
        - kind: required_parameter
        - kind: optional_parameter
        - kind: rest_pattern
    - has:
        kind: predefined_type
        regex: '^object$'
        stopBy: end
