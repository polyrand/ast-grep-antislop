id: typescript-no-unknown-parameters
language: TypeScript
severity: warning
message: Unknown parameters leave input unparsed; accept a domain type and parse at the I/O boundary.
rule:
  all:
    - any:
        - kind: required_parameter
        - kind: optional_parameter
        - kind: rest_pattern
    - has:
        kind: predefined_type
        regex: '^unknown$'
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: '^cause$'
          stopBy: end
