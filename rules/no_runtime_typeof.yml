# TypeScript
id: typescript-no-runtime-typeof
language: TypeScript
severity: warning
message: typeof check performs runtime narrowing. Parse once into typed value; use it in domain code. Keep check only in parser or intentional runtime dispatch.
rule:
  pattern: typeof $VALUE
---
# JavaScript
id: javascript-no-runtime-typeof
language: JavaScript
severity: warning
message: typeof check performs runtime narrowing. Parse once into typed value; use it in domain code. Keep check only in parser or intentional runtime dispatch.
rule:
  pattern: typeof $VALUE
---
# Python
id: python-no-runtime-typeof
language: Python
severity: warning
message: isinstance/type check performs runtime narrowing. Parse once into typed value; use it in domain code. Keep check only in parser or intentional runtime dispatch.
rule:
  any:
    - pattern: isinstance($VALUE, $TYPE)
    - pattern: type($VALUE) is $TYPE
    - pattern: type($VALUE) is not $TYPE
    - pattern: type($VALUE) == $TYPE
    - pattern: type($VALUE) != $TYPE
