id: python-no-known-value-widening
language: Python
severity: warning
message: This explicit broad annotation discards known value evidence; keep the inferred precise type.
utils:
  known-value:
    any:
      - kind: dictionary
      - kind: list
      - kind: set
      - kind: tuple
      - kind: string
      - kind: integer
      - kind: float
      - kind: 'true'
      - kind: 'false'
      - kind: lambda
  known-nonempty-mapping-value:
    any:
      - kind: dictionary
        regex: '(?s)^\{\s*.+\s*\}$'
      - kind: list
      - kind: set
      - kind: tuple
      - kind: string
      - kind: integer
      - kind: float
      - kind: 'true'
      - kind: 'false'
      - kind: lambda
rule:
  any:
    - pattern: '$NAME: $BROAD_TYPE = $KNOWN_VALUE'
    - pattern: '$NAME: $MAPPING_TYPE = $MAPPING_VALUE'
constraints:
  BROAD_TYPE:
    regex: '^(?:Any|typing\.Any|object)$'
  KNOWN_VALUE:
    matches: known-value
  MAPPING_TYPE:
    regex: '(?s)^(?:dict|Dict|Mapping|MutableMapping|dict\s*\[.*\]|Dict\s*\[.*\]|Mapping\s*\[.*\]|MutableMapping\s*\[.*\])$'
  MAPPING_VALUE:
    matches: known-nonempty-mapping-value
