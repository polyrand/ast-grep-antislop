id: python-no-conditional-empty-object-spread
language: Python
severity: warning
message: Conditional empty-dictionary expansion hides key omission; build the dictionary explicitly.
rule:
  any:
    - pattern:
        context: '__result = {**($VALUE if $COND else {})}'
        selector: dictionary_splat
    - pattern:
        context: '__result = {**({} if $COND else $VALUE)}'
        selector: dictionary_splat
