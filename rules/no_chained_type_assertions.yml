# TypeScript
id: typescript-no-chained-type-assertions
language: TypeScript
severity: warning
message: Chained type assertions discard type evidence; preserve the precise type or parse at the boundary.
rule:
  any:
    - kind: as_expression
      has:
        any:
          - kind: as_expression
          - kind: type_assertion
        stopBy: end
    - kind: type_assertion
      has:
        any:
          - kind: as_expression
          - kind: type_assertion
        stopBy: end
---
# JavaScript
id: javascript-no-chained-type-assertions
language: JavaScript
severity: warning
message: Chained runtime coercions discard evidence; parse once into the required domain value.
rule:
  pattern: $OUTER($INNER)
constraints:
  OUTER:
    kind: identifier
    regex: '^(?:Object|String|Number|Boolean)$'
  INNER:
    kind: call_expression
    has:
      field: function
      kind: identifier
      regex: '^(?:Object|String|Number|Boolean)$'
---
# Python
id: python-no-chained-type-assertions
language: Python
severity: warning
message: Chained casts fabricate type evidence; parse once into the required domain value.
rule:
  all:
    - any:
        - pattern: cast($TYPE, $VALUE)
        - pattern: typing.cast($TYPE, $VALUE)
    - has:
        any:
          - pattern: cast($INNER_TYPE, $INNER_VALUE)
          - pattern: typing.cast($INNER_TYPE, $INNER_VALUE)
        stopBy: end
