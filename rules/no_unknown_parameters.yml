# TypeScript
id: typescript-no-unknown-parameters
language: TypeScript
severity: warning
message: unknown parameter carries unparsed data. Parse it at function entry. Pass domain type onward. Keep unknown only in parser code.
rule:
  all:
    - any:
        - kind: required_parameter
        - kind: optional_parameter
        - kind: rest_pattern
    - has:
        kind: predefined_type
        regex: '^unknown$'
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: '^cause$'
          stopBy: end
---
# JavaScript
id: javascript-no-unknown-parameters
language: JavaScript
severity: warning
message: unknown JSDoc parameter carries unparsed data. Parse it at function entry. Pass domain type onward. Keep unknown only in parser code.
rule:
  all:
    - kind: comment
      regex: '(?s).*@param\s*\{\s*(?:unknown|\?)\s*\}.*'
    - not:
        regex: '(?s).*@param\s*\{\s*(?:unknown|\?)\s*\}\s+(?:\[\s*)?cause(?:\s*\])?(?:\s|$).*'
---
# Python
id: python-no-unknown-parameters
language: Python
severity: warning
message: Any parameter carries unparsed data. Parse it at function entry. Pass domain type onward. Keep Any only in parser code.
rule:
  all:
    - kind: typed_parameter
    - has:
        kind: identifier
        regex: '^Any$'
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: '^cause$'
          stopBy: end
