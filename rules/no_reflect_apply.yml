# TypeScript
id: typescript-no-reflect-apply
language: TypeScript
severity: warning
message: Reflect.apply hides function contract. Use typed call or named dispatcher. Put unavoidable dynamic call in adapter.
rule:
  any:
    - pattern: Reflect.apply($$$ARGS)
    - pattern: Reflect["apply"]($$$ARGS)
    - pattern: "Reflect['apply']($$$ARGS)"
---
# JavaScript
id: javascript-no-reflect-apply
language: JavaScript
severity: warning
message: Reflect.apply hides function contract. Use direct call or named dispatcher. Put unavoidable dynamic call in adapter.
rule:
  any:
    - pattern: Reflect.apply($$$ARGS)
    - pattern: Reflect["apply"]($$$ARGS)
    - pattern: "Reflect['apply']($$$ARGS)"
---
# Python
id: python-no-reflect-apply
language: Python
severity: warning
message: Dynamic __call__ hides function contract. Use typed call or protocol. Put unavoidable dynamic dispatch in adapter.
rule:
  any:
    - pattern: $FUNCTION.__call__($$$ARGS)
    - pattern: getattr($FUNCTION, "__call__")($$$ARGS)
