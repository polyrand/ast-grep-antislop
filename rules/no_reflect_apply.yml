# TypeScript
id: typescript-no-reflect-apply
language: TypeScript
severity: warning
message: Replace Reflect.apply with a typed function call or named dispatch interface.
rule:
  any:
    - pattern: Reflect.apply($$$ARGS)
    - pattern: Reflect["apply"]($$$ARGS)
    - pattern: "Reflect['apply']($$$ARGS)"
---
# JavaScript
id: javascript-no-reflect-apply
language: JavaScript
severity: warning
message: Replace Reflect.apply with a direct function call or named dispatch interface.
rule:
  any:
    - pattern: Reflect.apply($$$ARGS)
    - pattern: Reflect["apply"]($$$ARGS)
    - pattern: "Reflect['apply']($$$ARGS)"
---
# Python
id: python-no-reflect-apply
language: Python
severity: warning
message: Replace dynamic __call__ dispatch with an ordinary typed call or named protocol.
rule:
  any:
    - pattern: $FUNCTION.__call__($$$ARGS)
    - pattern: getattr($FUNCTION, "__call__")($$$ARGS)
