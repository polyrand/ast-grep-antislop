# TypeScript
id: typescript-no-shape-in-symbol-names
language: TypeScript
severity: warning
message: shape name may be valid. Rename vague application symbol to domain role. Keep test, tensor, and other valid domain uses.
rule:
  all:
    - any:
        - kind: identifier
        - kind: property_identifier
        - kind: private_property_identifier
        - kind: shorthand_property_identifier
        - kind: shorthand_property_identifier_pattern
        - kind: statement_identifier
        - kind: type_identifier
    - regex: '(?i)^.*shape.*$'
