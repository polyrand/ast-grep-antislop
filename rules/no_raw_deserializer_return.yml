# TypeScript
id: typescript-no-raw-deserializer-return
language: TypeScript
severity: warning
message: 'Review raw deserializer return. Parse into domain type. Return domain value. Keep raw data local.'
utils:
  raw-deserializer-call:
    any:
      - pattern: JSON.parse($$$)
      - pattern: $OBJECT.json($$$)
      - pattern: deserialize($$$)
      - pattern: fromJson($$$)
      - pattern: fromJSON($$$)
      - pattern: parseJson($$$)
      - pattern: parseJSON($$$)
rule:
  all:
    - matches: raw-deserializer-call
    - inside:
        kind: return_statement
        stopBy: neighbor
