# TypeScript
id: typescript-no-unknown-type-aliases
language: TypeScript
severity: warning
message: Type alias hides unknown. Keep raw type local. Parse into domain type before passing it onward.
rule:
  pattern: type $ALIAS = unknown
---
# JavaScript
id: javascript-no-unknown-type-aliases
language: JavaScript
severity: warning
message: JSDoc alias hides unknown. Keep raw type local. Parse into domain type before passing it onward.
rule:
  kind: comment
  regex: '(?s).*@typedef\s*\{\s*unknown\s*\}.*'
---
# Python
id: python-no-unknown-type-aliases
language: Python
severity: warning
message: Type alias hides Any. Keep raw type local. Parse into domain type before passing it onward.
rule:
  any:
    - pattern: $ALIAS = Any
    - pattern: '$ALIAS: TypeAlias = Any'
    - pattern: type $ALIAS = Any
