# TypeScript
id: typescript-require-safety-comment-for-type-assertion
language: TypeScript
severity: warning
message: 'Type assertion has no SAFETY comment. Add SAFETY: source, invariant, and reason. Remove assertion if no safety case exists.'
utils:
  non-const-assertion:
    any:
      - kind: as_expression
        not:
          regex: '(?s).*\bas\s+const\s*$'
      - kind: type_assertion
        not:
          regex: '(?s)^\s*<\s*const\s*>'
rule:
  all:
    - any:
        - kind: lexical_declaration
        - kind: variable_declaration
        - kind: return_statement
        - kind: expression_statement
        - kind: throw_statement
    - has:
        matches: non-const-assertion
        stopBy: end
    - not:
        any:
          - has:
              kind: comment
              regex: '(?s).*\bSAFETY\s*:.*'
              stopBy: end
          - follows:
              kind: comment
              regex: '(?s).*\bSAFETY\s*:.*'
              stopBy: neighbor
---
# JavaScript
id: javascript-require-safety-comment-for-type-assertion
language: JavaScript
severity: warning
message: 'JSDoc type assertion has no SAFETY comment. Add SAFETY: source, invariant, and reason. Remove assertion if no safety case exists.'
rule:
  all:
    - kind: comment
      regex: '(?s).*@type\s*\{[^}]+\}.*'
    - not:
        regex: '(?s).*\bSAFETY\s*:.*'
    - not:
        follows:
          kind: comment
          regex: '(?s).*\bSAFETY\s*:.*'
          stopBy: neighbor
    - precedes:
        kind: parenthesized_expression
        stopBy: neighbor
---
# Python
id: python-require-safety-comment-for-type-assertion
language: Python
severity: warning
message: 'Cast has no SAFETY comment. Add SAFETY: source, invariant, and reason. Parse into target type if possible.'
utils:
  cast-call:
    any:
      - pattern: cast($TYPE, $VALUE)
      - pattern: typing.cast($TYPE, $VALUE)
rule:
  all:
    - any:
        - kind: return_statement
        - kind: expression_statement
    - has:
        matches: cast-call
        stopBy: end
    - not:
        any:
          - has:
              kind: comment
              regex: '(?s).*\bSAFETY\s*:.*'
              stopBy: end
          - follows:
              kind: comment
              regex: '(?s).*\bSAFETY\s*:.*'
              stopBy: neighbor
