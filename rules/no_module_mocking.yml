# TypeScript
id: typescript-no-module-mocking
language: TypeScript
severity: warning
message: Replace module mocking with dependency injection through a real interface or faithful test implementation.
rule:
  any:
    - pattern: $FRAMEWORK.$METHOD($$$ARGS)
    - pattern: $FRAMEWORK["mock"]($$$ARGS)
    - pattern: $FRAMEWORK["doMock"]($$$ARGS)
    - pattern: $FRAMEWORK["unstable_mockModule"]($$$ARGS)
    - pattern: "$FRAMEWORK['mock']($$$ARGS)"
    - pattern: "$FRAMEWORK['doMock']($$$ARGS)"
    - pattern: "$FRAMEWORK['unstable_mockModule']($$$ARGS)"
constraints:
  FRAMEWORK:
    regex: '^(?:vi|jest)$'
  METHOD:
    regex: '^(?:mock|doMock|unstable_mockModule)$'
---
