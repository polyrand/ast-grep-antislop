---
# Python
id: python-no-module-mocking
language: Python
severity: warning
message: 'Module patch hides dependency. Use Dependency Injection: pass protocol or fake into function. Patch only module-boundary behavior.'
rule:
  any:
    - pattern: mock.patch($$$ARGS)
    - pattern: unittest.mock.patch($$$ARGS)
    - pattern: patch.object($$$ARGS)
    - pattern: mocker.patch($$$ARGS)
    - pattern: monkeypatch.setattr($$$ARGS)
