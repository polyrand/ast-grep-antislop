# TypeScript
id: typescript-no-module-mocking
language: TypeScript
severity: warning
message: 'Module mock hides dependency. Use Dependency Injection: pass interface or fake into function. Mock only module-boundary behavior.'
rule:
  any:
    - pattern: $FRAMEWORK.$METHOD($$$ARGS)
    - pattern: $FRAMEWORK["mock"]($$$ARGS)
    - pattern: $FRAMEWORK["doMock"]($$$ARGS)
    - pattern: $FRAMEWORK["unstable_mockModule"]($$$ARGS)
    - pattern: "$FRAMEWORK['mock']($$$ARGS)"
    - pattern: "$FRAMEWORK['doMock']($$$ARGS)"
    - pattern: "$FRAMEWORK['unstable_mockModule']($$$ARGS)"
constraints:
  FRAMEWORK:
    regex: '^(?:vi|jest)$'
  METHOD:
    regex: '^(?:mock|doMock|unstable_mockModule)$'
---
