# TypeScript
id: typescript-no-reflect-get
language: TypeScript
severity: warning
message: Reflect.get hides property contract. Use typed property access. Put dynamic key lookup in named adapter.
rule:
  any:
    - pattern: Reflect.get($$$ARGS)
    - pattern: Reflect["get"]($$$ARGS)
    - pattern: "Reflect['get']($$$ARGS)"
---
# JavaScript
id: javascript-no-reflect-get
language: JavaScript
severity: warning
message: Reflect.get hides property contract. Use direct property access. Put dynamic key lookup in named adapter.
rule:
  any:
    - pattern: Reflect.get($$$ARGS)
    - pattern: Reflect["get"]($$$ARGS)
    - pattern: "Reflect['get']($$$ARGS)"
---
# Python
id: python-no-reflect-get
language: Python
severity: warning
message: getattr hides property contract. Use typed attribute access. Put dynamic key lookup in named adapter.
rule:
  any:
    - pattern: getattr($OWNER, $KEY)
    - pattern: operator.attrgetter($KEY)($OWNER)
