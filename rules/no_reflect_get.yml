# TypeScript
id: typescript-no-reflect-get
language: TypeScript
severity: warning
message: Replace Reflect.get with typed property access or boundary parsing.
rule:
  any:
    - pattern: Reflect.get($$$ARGS)
    - pattern: Reflect["get"]($$$ARGS)
    - pattern: "Reflect['get']($$$ARGS)"
---
# JavaScript
id: javascript-no-reflect-get
language: JavaScript
severity: warning
message: Replace Reflect.get with direct property access or boundary parsing.
rule:
  any:
    - pattern: Reflect.get($$$ARGS)
    - pattern: Reflect["get"]($$$ARGS)
    - pattern: "Reflect['get']($$$ARGS)"
---
# Python
id: python-no-reflect-get
language: Python
severity: warning
message: Replace dynamic getattr access with a typed attribute or parse the boundary value.
rule:
  any:
    - pattern: getattr($OWNER, $KEY)
    - pattern: operator.attrgetter($KEY)($OWNER)
