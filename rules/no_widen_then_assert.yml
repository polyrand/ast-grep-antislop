# TypeScript
id: typescript-no-widen-then-assert
language: TypeScript
severity: warning
message: Broad type followed by assertion loses evidence. Keep source type. Parse into target type; do not use assertion as parser.
rule:
  any:
    - all:
        - pattern: const $OUT = $WIDE as $TYPE
        - follows:
            pattern: 'const $WIDE: $BROAD = $SOURCE'
            stopBy: end
    - all:
        - pattern: const $OUT = <$TYPE>$WIDE
        - follows:
            pattern: 'const $WIDE: $BROAD = $SOURCE'
            stopBy: end
constraints:
  BROAD:
    regex: '(?s)^(?:unknown|any|object|Record\s*<.*>)$'
  SOURCE:
    any:
      - kind: object
      - kind: array
      - kind: string
      - kind: number
      - kind: template_string
      - kind: new_expression
      - kind: identifier
---
# JavaScript
id: javascript-no-widen-then-assert
language: JavaScript
severity: warning
message: Broad JSDoc followed by assertion loses evidence. Keep source type. Parse into target type; do not use assertion as parser.
rule:
  all:
    - pattern: const $OUT = $WIDE
    - follows:
        kind: comment
        regex: '(?s).*@type\s*\{[^}]+\}.*'
        stopBy: neighbor
    - follows:
        all:
          - pattern: const $WIDE = $SOURCE
          - follows:
              kind: comment
              regex: '(?s).*@type\s*\{\s*(?:unknown|object|Record\s*<.*>)\s*\}.*'
              stopBy: neighbor
        stopBy: end
---
# Python
id: python-no-widen-then-assert
language: Python
severity: warning
message: Broad annotation followed by cast loses evidence. Keep source type. Parse into target type; do not use cast as validation.
rule:
  any:
    - all:
        - pattern:
            context: '$WIDE: $BROAD = $SOURCE'
            selector: expression_statement
        - precedes:
            pattern:
              context: '$OUT = cast($TYPE, $WIDE)'
              selector: expression_statement
            stopBy: end
    - all:
        - pattern:
            context: '$WIDE: $BROAD = $SOURCE'
            selector: expression_statement
        - precedes:
            pattern:
              context: '$OUT = typing.cast($TYPE, $WIDE)'
              selector: expression_statement
            stopBy: end
constraints:
  BROAD:
    regex: '(?s)^(?:Any|typing\.Any|object|dict\s*\[.*\]|Dict\s*\[.*\]|Mapping\s*\[.*\])$'
  SOURCE:
    any:
      - kind: dictionary
      - kind: list
      - kind: set
      - kind: tuple
      - kind: string
      - kind: integer
      - kind: float
      - kind: identifier
