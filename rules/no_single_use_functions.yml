# Python
id: python-no-single-use-functions
language: Python
severity: warning
message: This named function only forwards a call. If it has a single caller, inline the call instead.
rule:
  any:
    - pattern: |
        def $NAME($$$PARAMS):
            $RESULT = $CALL
            return $RESULT
    - pattern: |
        def $NAME($$$PARAMS) -> $RETURN_TYPE:
            $RESULT = $CALL
            return $RESULT
    - pattern: |
        def $NAME($$$PARAMS):
            return $CALL
    - pattern: |
        def $NAME($$$PARAMS) -> $RETURN_TYPE:
            return $CALL
constraints:
  CALL:
    kind: call
