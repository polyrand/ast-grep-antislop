# TypeScript
id: typescript-no-single-use-functions
language: TypeScript
severity: warning
message: This named function only forwards a call. If it has a single caller, inline the call instead.
rule:
  any:
    - pattern: |
        function $NAME($$$PARAMS) {
          const $RESULT = $CALL;
          return $RESULT;
        }
    - pattern: |
        function $NAME($$$PARAMS): $RETURN_TYPE {
          const $RESULT = $CALL;
          return $RESULT;
        }
    - pattern: |
        function $NAME($$$PARAMS) {
          return $CALL;
        }
    - pattern: |
        function $NAME($$$PARAMS): $RETURN_TYPE {
          return $CALL;
        }
constraints:
  CALL:
    kind: call_expression
---
