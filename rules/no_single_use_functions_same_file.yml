# TypeScript
id: typescript-no-single-use-functions-same-file
language: TypeScript
severity: warning
message: One direct call does not prove abstraction is unnecessary. Inline one-off trivial wrappers. Keep shared functions and meaningful boundary abstractions, for example parse_args(), even with one caller. Same-file scan misses cross-file callers.
utils:
  same-name-call:
    pattern: $NAME($$$_ARGS)
  contains-same-name-call:
    any:
      - matches: same-name-call
      - has:
          matches: same-name-call
          stopBy: end
  has-two-same-name-calls:
    any:
      - has:
          all:
            - matches: same-name-call
            - has:
                matches: same-name-call
                stopBy: end
          stopBy: end
      - has:
          all:
            - matches: contains-same-name-call
            - precedes:
                matches: contains-same-name-call
                stopBy: end
          stopBy: end
rule:
  all:
    - kind: function_declaration
    - has:
        field: name
        pattern: $NAME
        stopBy: end
    - not:
        has:
          matches: same-name-call
          stopBy: end
    - inside:
        all:
          - kind: program
          - has:
              matches: same-name-call
              stopBy: end
          - not:
              matches: has-two-same-name-calls
        stopBy: end
---
