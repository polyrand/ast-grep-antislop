# TypeScript
id: typescript-no-unsafe-dictionary-type
language: TypeScript
severity: warning
message: Broad dictionary has no value type. Define value type or schema. Parse raw map into domain type before use.
utils:
  unsafe-atomic-value:
    any:
      - kind: predefined_type
        regex: '^(?:unknown|any|object)$'
      - kind: object_type
        regex: '^\{\s*\}$'
  unsafe-dictionary-value:
    any:
      - matches: unsafe-atomic-value
      - kind: union_type
        has:
          matches: unsafe-atomic-value
          stopBy: end
      - kind: intersection_type
        has:
          matches: unsafe-atomic-value
          stopBy: end
      - kind: generic_type
        has:
          matches: unsafe-atomic-value
          stopBy: end
rule:
  any:
    - pattern:
        context: 'type __Dictionary = Record<$KEY, $VALUE>'
        selector: generic_type
    - pattern:
        context: 'type __Dictionary = { [$KEY: $KEY_TYPE]: $VALUE }'
        selector: index_signature
    - pattern:
        context: 'type __Dictionary = { [$KEY in $KEY_TYPE]: $VALUE }'
        selector: index_signature
constraints:
  VALUE:
    matches: unsafe-dictionary-value
---
# JavaScript
id: javascript-no-unsafe-dictionary-type
language: JavaScript
severity: warning
message: Broad JSDoc dictionary has no value type. Define value type or schema. Parse raw map into domain type before use.
rule:
  kind: comment
  regex: '(?s).*@typedef\s*\{\s*(?:Record\s*<\s*[^,>]+\s*,\s*(?:unknown|any|object)\s*>|Object\s*\.\s*<\s*[^,>]+\s*,\s*(?:unknown|any|object)\s*>)\s*\}.*'
---
# Python
id: python-no-unsafe-dictionary-type
language: Python
severity: warning
message: Broad mapping has no value type. Define value type or schema. Parse raw map into domain type before use.
rule:
  pattern:
    context: 'value: $CONTAINER[$KEY, $VALUE]'
    selector: generic_type
constraints:
  CONTAINER:
    regex: '^(?:dict|Dict|Mapping|MutableMapping)$'
  VALUE:
    all:
      - any:
          - kind: type
          - kind: identifier
          - kind: attribute
      - regex: '^(?:Any|typing\.Any|object)$'
