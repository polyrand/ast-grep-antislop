# TypeScript
id: typescript-no-unknown-returns
language: TypeScript
severity: warning
message: This function exposes unknown to callers; parse the value and return a domain type.
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: function_expression
        - kind: arrow_function
        - kind: function_type
        - kind: method_signature
        - kind: call_signature
        - kind: abstract_method_signature
    - has:
        field: return_type
        any:
          - kind: predefined_type
            regex: '^unknown$'
          - kind: type_annotation
            has:
              kind: predefined_type
              regex: '^unknown$'
              stopBy: end
          - kind: generic_type
            has:
              kind: predefined_type
              regex: '^unknown$'
              stopBy: end
---
# JavaScript
id: javascript-no-unknown-returns
language: JavaScript
severity: warning
message: This JSDoc contract exposes unknown to callers; parse and return a domain value.
rule:
  kind: comment
  regex: '(?s).*@returns?\s*\{\s*(?:unknown|Promise\s*<\s*unknown\s*>)\s*\}.*'
---
# Python
id: python-no-unknown-returns
language: Python
severity: warning
message: This function exposes Any to callers; parse the value and return a domain type.
rule:
  kind: function_definition
  has:
    field: return_type
    kind: type
    has:
      kind: identifier
      regex: '^Any$'
      stopBy: end
