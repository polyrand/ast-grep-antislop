# Python
id: python-no-boolean-behaviour-parameter
language: Python
severity: warning
message: 'Boolean flag selects behavior. Review abstraction. Split functions, or use domain type for distinct cases. Keep boolean for data.'
rule:
  all:
    - kind: function_definition
    - has:
        kind: if_statement
        has:
          field: condition
          any:
            - has:
                kind: identifier
                pattern: $FLAG
                stopBy: end
            - pattern: $FLAG
          stopBy: end
        stopBy: end
    - has:
        field: parameters
        has:
          all:
            - any:
                - kind: typed_parameter
                - kind: typed_default_parameter
            - has:
                kind: identifier
                pattern: $FLAG
                stopBy: end
            - has:
                field: type
                has:
                  kind: identifier
                  regex: '^bool$'
                  stopBy: end
                stopBy: end
          stopBy: end
        stopBy: end
