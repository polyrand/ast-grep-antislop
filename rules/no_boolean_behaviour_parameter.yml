# TypeScript
id: typescript-no-boolean-behaviour-parameter
language: TypeScript
severity: warning
message: 'Boolean flag selects behavior. Review abstraction. Split functions, or use domain type for distinct cases. Keep boolean for data.'
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: function_expression
        - kind: arrow_function
        - kind: method_definition
    - has:
        kind: if_statement
        has:
          field: condition
          any:
            - has:
                kind: identifier
                pattern: $FLAG
                stopBy: end
            - pattern: $FLAG
          stopBy: end
        stopBy: end
    - has:
        field: parameters
        has:
          all:
            - any:
                - kind: required_parameter
                - kind: optional_parameter
            - has:
                field: pattern
                pattern: $FLAG
                stopBy: end
            - has:
                kind: predefined_type
                regex: '^boolean$'
                stopBy: end
          stopBy: end
        stopBy: end
