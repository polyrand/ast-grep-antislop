# TypeScript
id: typescript-no-known-value-widening
language: TypeScript
severity: warning
message: Known value widened to broad type. Keep inference; use satisfies for shape checks. Keep broad type only when API contract requires it.
utils:
  known-value:
    any:
      - kind: object
      - kind: array
      - kind: string
      - kind: number
      - kind: 'true'
      - kind: 'false'
      - kind: template_string
      - kind: unary_expression
      - kind: arrow_function
      - kind: function_expression
      - kind: class
      - kind: new_expression
  known-nonempty-dictionary-value:
    any:
      - kind: object
        regex: '(?s)^\{\s*.+\s*\}$'
      - kind: array
      - kind: string
      - kind: number
      - kind: 'true'
      - kind: 'false'
      - kind: template_string
      - kind: unary_expression
      - kind: arrow_function
      - kind: function_expression
      - kind: class
      - kind: new_expression
rule:
  any:
    - pattern:
        context: 'const $NAME: $BROAD_TYPE = $KNOWN_VALUE'
        selector: variable_declarator
    - pattern:
        context: 'let $NAME: $BROAD_TYPE = $KNOWN_VALUE'
        selector: variable_declarator
    - pattern: $KNOWN_VALUE as $BROAD_TYPE
    - all:
        - pattern: return $KNOWN_VALUE
        - inside:
            pattern: 'function $FUNC($$$PARAMS): $BROAD_TYPE { $$$BODY }'
            stopBy: end
    - pattern:
        context: 'const $NAME: $DICTIONARY_TYPE = $DICTIONARY_VALUE'
        selector: variable_declarator
    - pattern:
        context: 'let $NAME: $DICTIONARY_TYPE = $DICTIONARY_VALUE'
        selector: variable_declarator
    - pattern: $DICTIONARY_VALUE as $DICTIONARY_TYPE
    - all:
        - pattern: return $DICTIONARY_VALUE
        - inside:
            pattern: 'function $FUNC($$$PARAMS): $DICTIONARY_TYPE { $$$BODY }'
            stopBy: end
constraints:
  BROAD_TYPE:
    regex: '(?s)^(?:unknown|object|\{.+\})$'
  KNOWN_VALUE:
    matches: known-value
  DICTIONARY_TYPE:
    regex: '(?s)^(?:Record\s*<.*>|Readonly\s*<\s*Record\s*<.*>\s*>)$'
  DICTIONARY_VALUE:
    matches: known-nonempty-dictionary-value
---
# JavaScript
id: javascript-no-known-value-widening
language: JavaScript
severity: warning
message: Known value widened by broad JSDoc. Remove broad JSDoc; keep inferred type. Keep broad JSDoc only when API contract requires it.
utils:
  known-value:
    any:
      - kind: object
      - kind: array
      - kind: string
      - kind: number
      - kind: 'true'
      - kind: 'false'
      - kind: template_string
      - kind: arrow_function
      - kind: function_expression
      - kind: class
      - kind: new_expression
  known-nonempty-dictionary-value:
    any:
      - kind: object
        regex: '(?s)^\{\s*.+\s*\}$'
      - kind: array
      - kind: string
      - kind: number
      - kind: 'true'
      - kind: 'false'
      - kind: template_string
      - kind: arrow_function
      - kind: function_expression
      - kind: class
      - kind: new_expression
rule:
  any:
    - all:
        - kind: comment
          regex: '(?s).*@type\s*\{\s*(?:unknown|object)\s*\}.*'
        - precedes:
            kind: lexical_declaration
            has:
              matches: known-value
              stopBy: end
            stopBy: neighbor
    - all:
        - kind: comment
          regex: '(?s).*@type\s*\{\s*(?:Record\s*<.*>|Object\s*\.\s*<.*>)\s*\}.*'
        - precedes:
            kind: lexical_declaration
            has:
              matches: known-nonempty-dictionary-value
              stopBy: end
            stopBy: neighbor
---
# Python
id: python-no-known-value-widening
language: Python
severity: warning
message: Known value widened by broad annotation. Remove broad annotation; keep inferred type. Keep broad annotation only when API contract requires it.
utils:
  known-value:
    any:
      - kind: dictionary
      - kind: list
      - kind: set
      - kind: tuple
      - kind: string
      - kind: integer
      - kind: float
      - kind: 'true'
      - kind: 'false'
      - kind: lambda
  known-nonempty-mapping-value:
    any:
      - kind: dictionary
        regex: '(?s)^\{\s*.+\s*\}$'
      - kind: list
      - kind: set
      - kind: tuple
      - kind: string
      - kind: integer
      - kind: float
      - kind: 'true'
      - kind: 'false'
      - kind: lambda
rule:
  any:
    - pattern: '$NAME: $BROAD_TYPE = $KNOWN_VALUE'
    - pattern: '$NAME: $MAPPING_TYPE = $MAPPING_VALUE'
constraints:
  BROAD_TYPE:
    regex: '^(?:Any|typing\.Any|object)$'
  KNOWN_VALUE:
    matches: known-value
  MAPPING_TYPE:
    regex: '(?s)^(?:dict|Dict|Mapping|MutableMapping|dict\s*\[.*\]|Dict\s*\[.*\]|Mapping\s*\[.*\]|MutableMapping\s*\[.*\])$'
  MAPPING_VALUE:
    matches: known-nonempty-mapping-value
